<header class="barra">
  <div class="barra__interior">
    <a class="barra__marca" routerLink="/clases">
      <img src="/logo.svg" alt="" /> Arena Fit
      <span class="barra__etiqueta">Panel</span>
    </a>

    <nav class="barra__enlaces">
      <a class="barra__enlace" routerLink="/clases" routerLinkActive="barra__enlace--activo">Clases</a>
      <a class="barra__enlace" routerLink="/horarios" routerLinkActive="barra__enlace--activo">Horarios</a>
      <a class="barra__enlace" routerLink="/miembros" routerLinkActive="barra__enlace--activo">Miembros</a>
      @if (sesion.usuario(); as usr) {
        <span class="barra__quien">{{ usr.nombre }}</span>
      }
      <button type="button" class="boton boton--secundario boton--chico" (click)="sesion.salir()">
        Salir
      </button>
    </nav>
  </div>
</header>

<main class="pagina">
  <router-outlet />
</main>
